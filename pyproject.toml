[project]
name = "vasculature-neighborhoods"
version = "0.1.0"
description = "Endothelial cell neighbourhood analysis of the HuBMAP intestine CODEX dataset"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasculature_neighborhoods"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
vasculature-neighborhoods = { path = ".", editable = true }
# Pinned to an exact commit: cellhier now ships an installable package
# (src/cellhier, hatchling) and provides the k-NN window construction
# (cellhier.knn_graph_neighborhood2.Neighborhoods) and the tissue-section
# scatter plot (cellhier.plot_john.catplot2) this project previously had to
# vendor. Update the rev when picking up a newer cellhier commit.
cellhier = { git = "https://github.com/alejandro-soto-franco/Hierarchical-Tissue-Unit-Annotation", rev = "294716a74d4d0df04e22e142ada55fe0329f3254" }

[tool.pixi.dependencies]
python = "3.11.*"
# pandas/numpy/scikit-learn/scipy/matplotlib-base are pinned exactly:
# cellhier (a pypi-dependency, below) requires each of these at an exact
# version. pixi solves conda and pypi dependencies against one shared
# environment, so a conda package's version must match a pypi dependency's
# pin exactly or the pypi solve fails.
pandas = "==2.2.3"
numpy = "==1.26.4"
scikit-learn = "==1.5.2"
scipy = "==1.14.1"
scikit-posthocs = ">=0.9,<1"
seaborn = "==0.13.2"
matplotlib-base = "==3.9.2"
pyarrow = ">=15,<19"
pyyaml = ">=6,<7"
requests = ">=2.31,<3"
snakemake = ">=8,<10"
pytest = ">=8,<9"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.6,<1"
pyrefly = "==1.3.0"

[tool.pixi.feature.lint.tasks]
lint = "ruff check src workflow tests && ruff format --check src workflow tests && pyrefly check src workflow tests"

[tool.pixi.environments]
default = { solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }

[tool.pixi.tasks]
smoke = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml config/smoke.yaml --cores 2 -p all"
all = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --cores 6 -p all"
test = "pytest tests -v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyrefly]
project-includes = ["src", "workflow", "tests"]
python-version = "3.11"

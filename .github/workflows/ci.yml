name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.79.0
          cache: true
      - name: Test
        run: pixi run test
      - name: Smoke
        run: pixi run smoke
      - name: Lint
        run: pixi run lint

  # label across environments, so an index lookup silently renames
  # clusters whenever that ordering shifts (see README, "Clusters are
  # named by content, not by index"). These are this port's own canonical
  # profiles: upstream's raw, pre-merge cluster centroids were never
  # printed or stored anywhere retrievable, only the final 11 merged
